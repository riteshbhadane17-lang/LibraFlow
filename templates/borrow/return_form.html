{% extends "base.html" %}
{% block title %}Return a Book{% endblock %}
{% block content %}
<div class="container my-4 d-flex justify-content-center">
  <div class="card p-4" style="max-width: 480px; width:100%;">
    <h3 class="mb-3"><i class="fa-solid fa-rotate-left"></i> Return a Book</h3>
    <form method="post" data-loading>
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
        </div>
      {% endfor %}
      <button class="btn btn-primary w-100" type="submit">Return</button>
    </form>
  </div>
</div>
{% endblock %}
