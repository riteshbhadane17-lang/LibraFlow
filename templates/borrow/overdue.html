{% extends "base.html" %}
{% block title %}Overdue Books{% endblock %}
{% block content %}
<div class="container my-4">
  <h2 class="mb-4"><i class="fa-solid fa-triangle-exclamation text-danger"></i> Overdue Books</h2>
  <table class="table table-hover bg-white">
    <thead><tr><th>Member</th><th>Book</th><th>Due Date</th><th>Days Late</th></tr></thead>
    <tbody>
    {% for r in records %}
      <tr class="table-danger">
        <td>{{ r.member_id }}</td>
        <td>{{ r.book_id }}</td>
        <td>{{ r.due_date|date:"d M Y" }}</td>
        <td>{{ r.days_late }}</td>
      </tr>
    {% empty %}
      <tr><td colspan="4" class="text-muted text-center">No overdue books. 🎉</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
