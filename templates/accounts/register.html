{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="container my-5 d-flex justify-content-center">
  <div class="card p-4" style="max-width: 480px; width: 100%;">
    <h3 class="mb-3 text-center"><i class="fa-solid fa-user-plus"></i> Create Account</h3>
    <form method="post" data-loading>
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
        </div>
      {% endfor %}
      <button class="btn btn-primary w-100" type="submit">Register</button>
    </form>
    <p class="text-center mt-3 mb-0 small">Already have an account? <a href="{% url 'accounts:login' %}">Login</a></p>
  </div>
</div>
{% endblock %}
